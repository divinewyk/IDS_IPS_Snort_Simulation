# =====================================================================
# lab_snort_ips.conf — minimal, self-contained Snort config for the
# PREVENTION (Phase 2) part of the demo.
#
# Identical to lab_snort_ids.conf except it loads local_ips.rules
# (action = drop). Combined with running Snort inline (-Q, afpacket
# bridge — see scripts/04_run_ips_mode.sh) this actually blocks the
# malicious packet before it reaches the victim.
# =====================================================================

ipvar HOME_NET 10.0.0.0/24
ipvar EXTERNAL_NET any

preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first, use_static_footprint_sizes
preprocessor stream5_icmp

output alert_fast: stdout
output alert_fast: /var/log/snort/lab_alerts_ips.log

# Our custom prevention ruleset (drop — actively blocks on the wire)
include ../rules/local_ips.rules

# config drop is implicit for the "drop" rule action, but this makes
# the inline enforcement behavior explicit for anyone reading the file.
config policy_mode: inline
