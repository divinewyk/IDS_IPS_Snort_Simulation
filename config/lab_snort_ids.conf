# =====================================================================
# lab_snort_ids.conf — minimal, self-contained Snort config for the
# DETECTION (Phase 1) part of the demo.
#
# Deliberately minimal (not the full distro snort.conf) so it starts
# reliably with no missing-file errors during a live presentation.
# =====================================================================

ipvar HOME_NET 10.0.0.0/24
ipvar EXTERNAL_NET any

# Basic TCP/ICMP session tracking so "flow:established" and threshold
# tracking in our rules work correctly.
preprocessor stream5_global: track_tcp yes, track_udp yes, track_icmp yes
preprocessor stream5_tcp: policy first, use_static_footprint_sizes
preprocessor stream5_icmp

# Output: fast, human-readable alerts to console + a log file
output alert_fast: stdout
output alert_fast: /var/log/snort/lab_alerts_ids.log

# Our custom detection ruleset (alert-only — nothing is blocked here)
include ../rules/local_ids.rules
